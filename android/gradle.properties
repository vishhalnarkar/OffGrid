org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# CRITICAL FIX: Disable Kotlin daemon to prevent cache lock issues
# This stops daemon processes from holding stale file handles on incremental cache files
kotlin.daemon.jvm.options=-Xmx2G,-XX:MaxMetaspaceSize=1G
org.gradle.parallel=true
org.gradle.workers.max=4
